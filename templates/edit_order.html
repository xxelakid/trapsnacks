{% extends 'base.html' %}
{% block title %}Edit order #{{ order.id }}{% endblock %}
{% block content %}
<div id="page" data-order-id="{{ order.id }}"></div>
<h1 class="h4">Edit order #{{ order.id }} <span class="badge bg-secondary">{{ order.order_type|capitalize }}</span>
  <span class="badge bg-info text-dark" id="status-badge">{{ order.status }}</span></h1>
<div class="row g-3">
  <div class="col-12 col-lg-5"><h2 class="h5">Menu</h2><div id="menu"></div></div>
  <div class="col-12 col-lg-7">
    <div class="card card-body">
      <div id="cart"></div>
      {% if order.order_type == 'delivery' %}
      <label class="form-label mt-3" for="address">Delivery address</label>
      <input id="address" class="form-control" value="{{ order.address }}">
      {% endif %}
      <label class="form-label mt-3" for="special_instructions">Special instructions</label>
      <textarea id="special_instructions" class="form-control" rows="2">{{ order.special_instructions }}</textarea>
      <div id="order-error" class="alert alert-danger mt-3 d-none"></div>
      <div class="d-flex gap-2 mt-3">
        <button id="save-btn" class="btn btn-success btn-lg">Save changes</button>
        <a href="/cashier" class="btn btn-outline-secondary btn-lg">Back</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='order_form.js') }}"></script>
<script src="{{ url_for('static', filename='edit_order.js') }}"></script>
{% endblock %}
