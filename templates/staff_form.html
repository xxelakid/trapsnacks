{% extends 'base.html' %}
{% block title %}{{ 'Edit ' ~ user.username if user else 'Add staff' }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <h1 class="h4">{{ 'Edit ' ~ user.username if user else 'Add a cashier or chef' }}</h1>
    <form method="post" class="card card-body">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label" for="username">Username</label>
      <input class="form-control mb-2" id="username" name="username" value="{{ form.get('username', '') }}" autocomplete="off">
      <label class="form-label" for="role">Role</label>
      <select class="form-select mb-2" id="role" name="role">
        <option value="">Choose...</option>
        <option value="cashier" {{ 'selected' if form.get('role') == 'cashier' }}>Cashier</option>
        <option value="chef" {{ 'selected' if form.get('role') == 'chef' }}>Chef</option>
      </select>
      <label class="form-label" for="password">
        {{ 'New password (leave blank to keep the current one)' if user else 'Password (at least 8 characters)' }}
      </label>
      <input class="form-control mb-3" id="password" name="password" type="password" autocomplete="new-password">
      <div class="d-flex gap-2">
        <button class="btn btn-primary btn-lg" type="submit">{{ 'Save changes' if user else 'Create account' }}</button>
        <a class="btn btn-outline-secondary btn-lg" href="/staff">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
