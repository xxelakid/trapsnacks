{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <h1 class="h3 mb-3">Log in</h1>
    <form method="post" class="card card-body">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label" for="username">Username</label>
      <input class="form-control form-control-lg mb-3" id="username" name="username" autocomplete="username" required autofocus>
      <label class="form-label" for="password">Password</label>
      <input class="form-control form-control-lg mb-3" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary btn-lg" type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
